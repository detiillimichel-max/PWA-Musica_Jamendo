name: gerar icones PWA

on:
  push:
    paths:
      - '.github/workflows/gerar-icones-pwa.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Restaurar imagem enviada
        env:
          ICON_B64: ''
        run: |
          printf '%s' "$ICON_B64" | base64 -d > icon-192.png
          convert icon-192.png -resize 512x512 icon-512.png

      - name: Salvar icones
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icon-192.png icon-512.png
          git diff --cached --quiet && exit 0
          git commit -m "chore: atualizar icones PWA"
          git push
